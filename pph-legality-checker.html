<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPH — Deck Legality Checker</title>
<style>
  @font-face{
    font-family:'Beleren';
    src:url('Beleren-Bold.woff2') format('woff2'),
        url('Beleren-Bold.woff') format('woff'),
        url('Beleren-Bold.ttf') format('truetype');
    font-weight:600;
    font-display:swap;
  }

  :root{
    --bg:#14120F;
    --panel:#1D1A15;
    --panel-border:#332C21;
    --text:#EDE6D6;
    --text-dim:#A99C84;
    --accent:#D8551D;
    --accent-dim:#93381A;
    --mythic:#D8551D;
    --rare:#C9A227;
    --uncommon:#9FB8C9;
    --common:#726A5A;
    --good:#5C9468;
    --good-bg:#1B2A1D;
    --bad:#C15B4E;
    --bad-bg:#2A1917;
    --title-font: 'Beleren', Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    line-height:1.5;
    padding:48px 20px 80px;
  }
  #app{max-width:640px;margin:0 auto;}

  .hero{display:flex;align-items:center;gap:18px;margin-bottom:8px;}
  .logo{width:52px;height:52px;object-fit:contain;flex:0 0 auto;}

  h1{font-family:var(--title-font);font-size:2.1rem;font-weight:600;margin:0;letter-spacing:0.3px;}
  .subtitle{color:var(--text-dim);font-size:0.95rem;margin:4px 0 0;}

  .lede{color:var(--text-dim);font-size:0.92rem;margin:22px 0 28px;max-width:56ch;}

  label{display:block;font-size:0.85rem;color:var(--text-dim);margin-bottom:6px;}
  label .hint{font-weight:400;color:var(--text-dim);opacity:0.75;}

  textarea{
    width:100%;
    min-height:220px;
    background:var(--panel);
    border:1px solid var(--panel-border);
    color:var(--text);
    font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size:0.88rem;
    border-radius:6px;
    padding:14px;
    resize:vertical;
  }
  textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}

  button{
    font-family:var(--sans);
    font-size:0.9rem;
    border-radius:6px;
    border:1px solid transparent;
    padding:11px 18px;
    cursor:pointer;
  }
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .btn-primary{background:var(--accent);color:#1A0E08;font-weight:600;}
  .btn-primary:hover{background:#E0632B;}
  .btn-primary:disabled{background:var(--accent-dim);color:#4a2f24;cursor:not-allowed;}
  .btn-secondary{background:transparent;color:var(--text);border-color:var(--panel-border);}
  .btn-secondary:hover{border-color:var(--text-dim);}

  .check-row{margin-top:18px;display:flex;align-items:center;gap:14px;}
  .progress{color:var(--text-dim);font-size:0.85rem;}

  #error-box{
    display:none;margin-top:18px;padding:12px 14px;border-radius:6px;
    background:var(--bad-bg);border:1px solid var(--bad);color:#E8B4AC;font-size:0.88rem;
  }

  #results{display:none;margin-top:44px;}
  #results h2{font-family:var(--serif);font-size:1.3rem;margin:0 0 16px;font-weight:600;}

  .banner{
    border-radius:8px;padding:18px 20px;margin-bottom:20px;
    font-family:var(--serif);font-size:1.15rem;font-weight:600;
  }
  .banner.legal{background:var(--good-bg);color:#9FD1A9;border:1px solid var(--good);}
  .banner.illegal{background:var(--bad-bg);color:#E8B4AC;border:1px solid var(--bad);}

  .criteria{list-style:none;padding:0;margin:0 0 24px;display:flex;flex-direction:column;gap:9px;}
  .criteria li{display:flex;gap:10px;align-items:flex-start;font-size:0.92rem;}
  .mark{flex:0 0 auto;width:18px;text-align:center;font-weight:700;}
  .mark.ok{color:var(--good);}
  .mark.no{color:var(--bad);}
  .crit-text .crit-detail{display:block;color:var(--text-dim);font-size:0.85rem;margin-top:1px;}

  details{background:var(--panel);border:1px solid var(--panel-border);border-radius:6px;padding:2px 16px;margin-bottom:24px;}
  summary{cursor:pointer;padding:12px 0;font-size:0.88rem;color:var(--text-dim);}
  table{width:100%;border-collapse:collapse;font-size:0.85rem;margin-bottom:14px;}
  th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--panel-border);}
  th{color:var(--text-dim);font-weight:500;font-size:0.78rem;}
  .rarity-tag{display:inline-flex;align-items:center;gap:6px;}
  .gem{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .gem.myth{background:var(--mythic);}
  .gem.rare{background:var(--rare);}
  .gem.unc{background:var(--uncommon);}
  .gem.common{background:var(--common);}

  .print-row{margin-top:8px;display:flex;gap:10px;align-items:center;}
  .print-row input[type=text]{
    flex:1;
    background:var(--panel);
    border:1px solid var(--panel-border);
    color:var(--text);
    font-size:0.88rem;
    border-radius:6px;
    padding:10px 12px;
  }
  .print-row input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px;}

  /* Print pyramid — hidden on screen, shown only when printing */
  #pyramid-print{display:none;}

  @media print{
    html, body{margin:0 !important;padding:0 !important;height:auto !important;}
    body > #app{display:none !important;}
    #pyramid-print{
      display:flex !important;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      height:100vh;
      width:100vw;
      gap:1.8vh;
    }
    @page{margin:8mm;size:auto;}
    #pyramid-title{
      font-family:var(--title-font);
      font-size:1.5rem;
      font-weight:600;
      color:#1A1A1A;
      text-align:center;
      margin-bottom:0.6vh;
    }
    .pyramid-row{display:flex;gap:1.4vw;justify-content:center;}
    .pyramid-row img{height:23vh;width:auto;border-radius:3.5% / 2.5%;display:block;}
    #pyramid-print.has-title .pyramid-row img{height:20vh;}
  }
</style>
</head>
<body>

<div id="app">
  <div class="hero">
    <img src="logo.png" alt="PPH logo" class="logo">
    <div>
      <h1>Pyramid Pauper Highlander</h1>
      <p class="subtitle">Deck legality checker</p>
    </div>
  </div>

  <p class="lede">Paste your decklist below to perform a legality check and print your pyramid.</p>

  <label for="decklist-input">Decklist <span class="hint">(use Moxfield format for best results)</span></label>
  <textarea id="decklist-input" placeholder="1 Lightning Bolt&#10;1 Counterspell&#10;1 Brainstorm&#10;...&#10;&#10;Sideboard:&#10;1 Pyroblast"></textarea>

  <div class="check-row">
    <button class="btn-primary" id="check-btn" type="button">Check legality</button>
    <span class="progress" id="progress-text"></span>
  </div>

  <div id="error-box"></div>

  <div id="results">
    <h2>Deck legality check</h2>
    <div class="banner" id="banner"></div>
    <ul class="criteria" id="criteria-list"></ul>

    <details>
      <summary id="breakdown-summary">Card-by-card rarity breakdown</summary>
      <table id="breakdown-table">
        <thead><tr><th>Card</th><th>Qty</th><th>Rarity used</th></tr></thead>
        <tbody id="breakdown-body"></tbody>
      </table>
    </details>

    <div class="print-row" id="print-row" style="display:none;">
      <input type="text" id="deck-name-input" placeholder="Deck name (optional)" aria-label="Deck name">
      <button class="btn-primary" id="print-btn" type="button">Print deck pyramid</button>
    </div>
  </div>
</div>

<div id="pyramid-print"></div>

<script>
(function(){
  "use strict";

  // ---- PPH banlist -------------------------------------------------
  // Placeholder — fill in with the real PPH filter when ready.
  // Card names are matched case-insensitively.
  const BANNED_CARDS = new Set([
    // "Sol Ring",
  ].map(s => s.toLowerCase()));

  const RARITY_RANK = { common: 0, uncommon: 1, rare: 2, mythic: 3 };

  const textarea = document.getElementById('decklist-input');
  const checkBtn = document.getElementById('check-btn');
  const progressText = document.getElementById('progress-text');
  const errorBox = document.getElementById('error-box');
  const resultsEl = document.getElementById('results');
  const bannerEl = document.getElementById('banner');
  const criteriaList = document.getElementById('criteria-list');
  const breakdownBody = document.getElementById('breakdown-body');
  const breakdownSummary = document.getElementById('breakdown-summary');
  const printRow = document.getElementById('print-row');
  const deckNameInput = document.getElementById('deck-name-input');
  const printBtn = document.getElementById('print-btn');
  const pyramidPrint = document.getElementById('pyramid-print');

  function sleep(ms){ return new Promise(res => setTimeout(res, ms)); }

  // Wrapper around fetch that respects Scryfall's rate limiting: on a 429
  // (or a transient 5xx), wait and retry with backoff instead of giving up.
  async function scryfallFetch(url, options, attempt){
    attempt = attempt || 0;
    const resp = await fetch(url, options);
    if ((resp.status === 429 || resp.status >= 500) && attempt < 4){
      const retryAfterHeader = parseFloat(resp.headers.get('Retry-After'));
      const waitMs = !isNaN(retryAfterHeader) ? retryAfterHeader * 1000 : 400 * Math.pow(2, attempt);
      await sleep(waitMs);
      return scryfallFetch(url, options, attempt + 1);
    }
    return resp;
  }

  function showError(msg){
    errorBox.textContent = msg;
    errorBox.style.display = 'block';
  }
  function clearError(){
    errorBox.style.display = 'none';
    errorBox.textContent = '';
  }

  // ---- Decklist parsing ---------------------------------------------

  const SIDEBOARD_HEADER_RE = /^(sideboard|maybeboard|maybe\s*board|considering)\s*:?\s*$/i;
  const CARD_LINE_RE = /^(\d+)x?\s+(.+)$/;

  function parseCardEntryText(raw){
    let s = raw.trim();
    let set = null, collector = null;
    for (let i = 0; i < 4; i++){
      const before = s;
      let m;
      if ((m = s.match(/\s*\*F\*\s*$/i))){ s = s.slice(0, m.index); continue; }
      if ((m = s.match(/\s*\(F\)\s*$/i))){ s = s.slice(0, m.index); continue; }
      if ((m = s.match(/\s*[\(\[]([A-Za-z0-9]{2,6})[\)\]]\s*([A-Za-z0-9★\-†]*)\s*$/))){
        set = m[1].toLowerCase();
        collector = m[2] ? m[2].trim() : null;
        s = s.slice(0, m.index);
        continue;
      }
      if (s === before) break;
    }
    return { name: s.trim(), set, collector };
  }

  function parseDecklist(text){
    const lines = text.split(/\r?\n/);
    const main = new Map(); // key(normalized lowercase name) -> {name, qty, set, collector}
    let inSideboard = false;
    for (const raw of lines){
      const line = raw.trim();
      if (!line) continue;
      if (SIDEBOARD_HEADER_RE.test(line)){ inSideboard = true; continue; }
      if (inSideboard) continue;
      const m = line.match(CARD_LINE_RE);
      if (!m) continue; // headers like "Deck" or stray text, ignore
      const qty = parseInt(m[1], 10);
      const parsed = parseCardEntryText(m[2]);
      const name = normalizeName(parsed.name);
      if (!name) continue;
      const key = name.toLowerCase();
      if (main.has(key)){
        main.get(key).qty += qty;
      } else {
        main.set(key, { name, qty, set: parsed.set, collector: parsed.collector });
      }
    }
    return main;
  }

  // ---- Scryfall lookups -----------------------------------------------

  // Every printing considered for rarity/legality must satisfy this filter
  // (equivalent to the Scryfall search: game:paper (-set:sld OR (set:sld
  // -is:reprint)) -s:slx -is:extra -is:promo -is:judge -is:funny
  // -border:silver -stamp:acorn). Implemented client-side against fields
  // already present on each printing we fetch, rather than as one giant
  // compound query — a 20-oracle-id OR combined with this whole filter was
  // silently coming back empty (likely a query-length/complexity limit on
  // Scryfall's end), which made every card in a batch look "illegal" at
  // once instead of flagging a specific one.
  function isLegalPrinting(card){
    if (!card.games || card.games.indexOf('paper') === -1) return false;          // game:paper
    if (card.set === 'sld' && card.reprint) return false;                          // -set:sld OR (set:sld -is:reprint)
    if (card.set === 'slx') return false;                                         // -s:slx
    if (isExtraCard(card)) return false;                                          // -is:extra
    if (card.promo) return false;                                                 // -is:promo
    if (card.promo_types && card.promo_types.indexOf('judgegift') !== -1) return false; // -is:judge
    if (card.set_type === 'funny') return false;                                  // -is:funny
    if (card.border_color === 'silver') return false;                             // -border:silver
    if (card.security_stamp === 'acorn') return false;                            // -stamp:acorn
    return true;
  }

  function isExtraCard(card){
    const extraLayouts = ['token', 'emblem', 'art_series', 'double_faced_token', 'scheme', 'vanguard', 'planar'];
    if (card.layout && extraLayouts.indexOf(card.layout) !== -1) return true;
    if (card.set_type === 'memorabilia' || card.set_type === 'token') return true;
    return false;
  }

  function bestImageUrl(card){
    if (card.image_uris) return card.image_uris.normal || card.image_uris.large || card.image_uris.small || null;
    if (card.card_faces && card.card_faces[0] && card.card_faces[0].image_uris){
      return card.card_faces[0].image_uris.normal || card.card_faces[0].image_uris.large || null;
    }
    return null;
  }

  function pickLowestPrinting(printings){
    let best = null;
    for (const c of printings){
      const rank = RARITY_RANK.hasOwnProperty(c.rarity) ? RARITY_RANK[c.rarity] : 4;
      if (!best || rank < best.rank) best = { rank, card: c };
    }
    return best;
  }

  function normalizeName(name){
    return name
      .replace(/[\u2018\u2019]/g, "'")   // curly single quotes -> straight
      .replace(/[\u201C\u201D]/g, '"')   // curly double quotes -> straight
      .replace(/[\u2013\u2014]/g, '-')   // en/em dash -> hyphen
      .replace(/\s+/g, ' ')
      .trim();
  }

  function chunkArray(arr, size){
    const out = [];
    for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
    return out;
  }

  async function safeErrorDetail(resp){
    try {
      const body = await resp.json();
      return body && body.details ? body.details : null;
    } catch (e){ return null; }
  }

  async function resolveCard(name){
    // Fuzzy match first — this is Scryfall's own recommended way to resolve
    // arbitrary user-typed names, and tolerates the punctuation drift
    // (curly quotes, spacing) and split/adventure full names that the
    // strict exact-name search chokes on.
    let resp = await scryfallFetch('https://api.scryfall.com/cards/named?fuzzy=' + encodeURIComponent(name));
    if (resp.ok) return { card: await resp.json() };
    const fuzzyDetail = await safeErrorDetail(resp);

    await sleep(120);

    // Exact-name fallback, for the rare case fuzzy matching gets confused.
    resp = await scryfallFetch('https://api.scryfall.com/cards/named?exact=' + encodeURIComponent(name));
    if (resp.ok) return { card: await resp.json() };
    const exactDetail = await safeErrorDetail(resp);

    return { error: 'not_found', reason: fuzzyDetail || exactDetail || 'No card matched this name on Scryfall.' };
  }

  async function fetchLowestPrinting(rawName){
    const name = normalizeName(rawName);
    try {
      const resolved = await resolveCard(name);
      if (resolved.error) return resolved;
      if (!resolved.card.oracle_id) return { error: 'not_found', reason: 'This card has no oracle id (unsupported card type).' };

      await sleep(120);
      const prints = await fetchPrintsForOracleIds([resolved.card.oracle_id]);
      if (!prints.length) return { error: 'illegal_printing', reason: 'No printing of this card satisfies the PPH print-legality filter.' };
      const best = pickLowestPrinting(prints);
      if (!best) return { error: 'not_found', reason: 'No usable printings.' };

      return {
        rarity: best.card.rarity,
        rank: best.rank,
        image: bestImageUrl(best.card),
        scryfallName: best.card.name,
        oracleId: resolved.card.oracle_id
      };
    } catch (e){
      return { error: 'network_error', reason: (e && e.message) || 'Network error.' };
    }
  }

  // ---- Bulk lookup ------------------------------------------------------
  // A 60-card deck can easily have 40+ unique cards, and looking each one
  // up individually (1-2 requests apiece) is what was tripping Scryfall's
  // rate limiting. These two calls resolve the whole deck in a handful of
  // requests instead: one batch call to match names -> cards, then one (or
  // a few, paginated) search to pull every printing of every matched card
  // at once via their oracle IDs.

  async function resolveNamesBulk(names){
    const matched = [];   // Scryfall card objects, one per matched name
    const notFound = [];  // names Scryfall's collection endpoint couldn't match
    const chunks = chunkArray(names, 75);
    for (let i = 0; i < chunks.length; i++){
      if (i > 0) await sleep(150);
      try {
        const resp = await scryfallFetch('https://api.scryfall.com/cards/collection', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifiers: chunks[i].map(n => ({ name: n })) })
        });
        if (!resp.ok){
          notFound.push(...chunks[i]);
          continue;
        }
        const data = await resp.json();
        if (data.data) matched.push(...data.data);
        if (data.not_found){
          for (const ident of data.not_found){
            if (ident && ident.name) notFound.push(ident.name);
          }
        }
      } catch (e){
        notFound.push(...chunks[i]);
      }
    }
    return { matched, notFound };
  }

  async function fetchPrintsForOracleIds(oracleIds){
    const all = [];
    const chunks = chunkArray(oracleIds, 20);
    for (let i = 0; i < chunks.length; i++){
      if (i > 0) await sleep(150);
      const query = '(' + chunks[i].map(id => 'oracleid:' + id).join(' or ') + ')';
      let url = 'https://api.scryfall.com/cards/search?q=' + encodeURIComponent(query) + '&unique=prints&order=released';
      let guard = 0;
      while (url && guard < 20){
        guard++;
        const resp = await scryfallFetch(url);
        if (resp.status === 404) break; // zero prints at all for this chunk — not an error
        if (!resp.ok) break;
        const data = await resp.json();
        if (data.data) all.push(...data.data);
        url = data.has_more ? data.next_page : null;
        if (url) await sleep(150);
      }
    }
    return all.filter(isLegalPrinting);
  }

  // Fetches one exact printing (the specific set + collector number a
  // decklist line pointed at), for showing the real card art in the
  // printed pyramid rather than whichever printing rarity checking used.
  async function fetchExactPrinting(set, collector){
    if (!set || !collector) return null;
    try {
      const url = 'https://api.scryfall.com/cards/' + encodeURIComponent(set) + '/' + encodeURIComponent(collector);
      const resp = await scryfallFetch(url);
      if (!resp.ok) return null;
      const card = await resp.json();
      return bestImageUrl(card);
    } catch (e){
      return null;
    }
  }

  // Correlates a Scryfall-matched card back to the entry key(s) it could
  // have come from — handles split/adventure cards whose full name
  // ("Front // Back") doesn't match the front-face name a user pasted.
  function candidateKeysForCard(card){
    const keys = [card.name.toLowerCase()];
    if (card.name.indexOf(' // ') !== -1){
      keys.push(card.name.split(' // ')[0].trim().toLowerCase());
    }
    return keys;
  }

  // ---- PPH banlist (banlist.txt, next to this file) ---------------------

  async function fetchBanlist(){
    try {
      const resp = await fetch('banlist.txt', { cache: 'no-store' });
      if (!resp.ok) return { list: new Set(), warning: 'banlist.txt not found (status ' + resp.status + ') — banned-card check was skipped.' };
      const text = await resp.text();
      const list = new Set(
        text.split(/\r?\n/)
          .map(l => l.trim())
          .filter(l => l && !l.startsWith('#'))
          .map(l => l.toLowerCase())
      );
      return { list, warning: null };
    } catch (e){
      return { list: new Set(), warning: 'Could not load banlist.txt — banned-card check was skipped.' };
    }
  }

  // ---- Legality check --------------------------------------------------

  checkBtn.addEventListener('click', runCheck);

  async function runCheck(){
    clearError();
    resultsEl.style.display = 'none';
    printRow.style.display = 'none';
    pyramidPrint.innerHTML = '';

    const main = parseDecklist(textarea.value);
    if (main.size === 0){
      showError('No cards found. Paste a decklist with lines like "1 Lightning Bolt".');
      return;
    }

    checkBtn.disabled = true;
    progressText.textContent = 'Checking connection to Scryfall…';

    // Fail fast with a clear diagnosis instead of quietly marking every
    // card "not found" when the real problem is that the browser is
    // blocking the request entirely (most commonly: this file was opened
    // directly as file:// instead of served over http/https).
    try {
      const probe = await scryfallFetch('https://api.scryfall.com/cards/named?exact=Mountain');
      if (!probe.ok) throw new Error('status ' + probe.status);
    } catch (e){
      checkBtn.disabled = false;
      progressText.textContent = '';
      showError('Couldn\'t reach Scryfall at all (every lookup would fail the same way, not just specific cards). This usually means the page was opened directly as a local file. Serve it over http:// instead — e.g. run a local server ("python3 -m http.server" in this file\'s folder) or host it on GitHub Pages — then try again. Browser console error: ' + (e && e.message ? e.message : 'unknown'));
      return;
    }

    const entries = Array.from(main.values());
    const totalCards = entries.reduce((s, e) => s + e.qty, 0);

    checkBtn.disabled = true;
    const results = [];
    const notFound = [];
    const illegalPrinting = [];

    progressText.textContent = 'Loading banlist…';
    const banlistResult = await fetchBanlist();
    const effectiveBanlist = new Set([...BANNED_CARDS, ...banlistResult.list]);

    // Phase 1: resolve all names in bulk (a handful of requests total).
    progressText.textContent = 'Looking up ' + entries.length + ' cards…';
    const entryByKey = new Map(entries.map(e => [e.name.toLowerCase(), e]));
    const unmatchedKeys = new Set(entryByKey.keys());
    const cardByKey = new Map(); // entry key -> matched Scryfall card

    const { matched, notFound: bulkNotFound } = await resolveNamesBulk(entries.map(e => e.name));
    for (const card of matched){
      for (const key of candidateKeysForCard(card)){
        if (unmatchedKeys.has(key) && !cardByKey.has(key)){
          cardByKey.set(key, card);
          unmatchedKeys.delete(key);
          break;
        }
      }
    }

    // Phase 2: pull every legal-format printing of every matched card in
    // one/few batched searches by oracle ID, then keep the lowest-rarity
    // one of each. A card with zero results here has real printings, but
    // none of them satisfy the PPH print-legality filter (e.g. it only
    // exists as a promo, a funny/Un-set card, or a Secret-Lair-only drop).
    const oracleIds = Array.from(new Set(Array.from(cardByKey.values())
      .map(c => c.oracle_id)
      .filter(Boolean)));
    const lowestByOracleId = new Map();
    if (oracleIds.length){
      progressText.textContent = 'Checking rarities and legal printings…';
      const allPrints = await fetchPrintsForOracleIds(oracleIds);
      const byOracle = new Map();
      for (const c of allPrints){
        if (!c.oracle_id) continue;
        if (!byOracle.has(c.oracle_id)) byOracle.set(c.oracle_id, []);
        byOracle.get(c.oracle_id).push(c);
      }
      for (const [oid, prints] of byOracle){
        const best = pickLowestPrinting(prints);
        if (best) lowestByOracleId.set(oid, best);
      }
    }

    for (const [key, card] of cardByKey){
      const entry = entryByKey.get(key);
      if (!card.oracle_id){
        notFound.push({ name: entry.name, reason: 'This card has no oracle id (unsupported card type).' });
        continue;
      }
      const best = lowestByOracleId.get(card.oracle_id);
      if (best){
        results.push(Object.assign({}, entry, {
          rarity: best.card.rarity,
          rank: best.rank,
          image: bestImageUrl(best.card),
          scryfallName: best.card.name,
          oracleId: card.oracle_id
        }));
      } else {
        illegalPrinting.push({ name: entry.name, reason: 'No printing of this card satisfies the PPH print-legality filter (paper only, no promos/funny/Secret-Lair-only/etc.).' });
      }
    }

    // Phase 3: anything the bulk pass couldn't match (typos, truly unknown
    // names) gets one more try individually, since that path tolerates
    // fuzzier matching — this list should normally be empty or tiny.
    const stragglerKeys = Array.from(unmatchedKeys);
    for (let i = 0; i < stragglerKeys.length; i++){
      const entry = entryByKey.get(stragglerKeys[i]);
      progressText.textContent = 'Double-checking ' + entry.name + ' (' + (i + 1) + ' of ' + stragglerKeys.length + ')…';
      const r = await fetchLowestPrinting(entry.name);
      if (r.error === 'illegal_printing') illegalPrinting.push({ name: entry.name, reason: r.reason });
      else if (r.error) notFound.push({ name: entry.name, reason: r.reason || r.error });
      else results.push(Object.assign({}, entry, r));
      await sleep(150);
    }

    progressText.textContent = '';
    checkBtn.disabled = false;

    let mythic = 0, rare = 0, uncommon = 0, common = 0;
    for (const r of results){
      if (r.rarity === 'mythic') mythic += r.qty;
      else if (r.rarity === 'rare') rare += r.qty;
      else if (r.rarity === 'uncommon') uncommon += r.qty;
      else common += r.qty;
    }

    const banned = results.filter(r => effectiveBanlist.has(r.name.toLowerCase()) || effectiveBanlist.has(r.scryfallName.toLowerCase()));
    const nonSingleton = results.filter(r => r.rarity !== 'common' && r.qty > 1);

    const countOk = totalCards === 60;
    const rarityOk = mythic === 1 && rare === 2 && uncommon === 3;
    const cleanOk = banned.length === 0 && notFound.length === 0 && illegalPrinting.length === 0 && nonSingleton.length === 0;
    const legal = countOk && rarityOk && cleanOk;

    renderResults({
      totalCards, mythic, rare, uncommon, common,
      countOk, rarityOk, cleanOk, legal,
      banned, notFound, illegalPrinting, nonSingleton, results,
      banlistWarning: banlistResult.warning
    });
  }

  function renderResults(s){
    resultsEl.style.display = 'block';

    bannerEl.className = 'banner ' + (s.legal ? 'legal' : 'illegal');
    bannerEl.textContent = s.legal ? 'Legal PPH deck' : 'Not a legal PPH deck';

    criteriaList.innerHTML = '';
    addCriterion(
      s.countOk,
      'Exactly 60 cards',
      s.totalCards + ' card' + (s.totalCards === 1 ? '' : 's') + ' in the main deck.'
    );
    addCriterion(
      s.rarityOk,
      'Rarity balance: 1 mythic, 2 rare, 3 uncommon',
      'Found ' + s.mythic + ' mythic, ' + s.rare + ' rare, ' + s.uncommon + ' uncommon, ' + s.common + ' common — using each card\'s lowest available printing.'
    );

    let cleanDetail = 'No banned cards, unrecognized cards, illegal printings, or singleton violations.';
    const problems = [];
    if (s.banned.length) problems.push('banned: ' + s.banned.map(c => c.name).join(', '));
    if (s.notFound.length) problems.push('not found on Scryfall: ' + s.notFound.map(n => n.name).join(', '));
    if (s.illegalPrinting.length) problems.push('no legal printing: ' + s.illegalPrinting.map(n => n.name).join(', '));
    if (s.nonSingleton.length) problems.push('more than one copy of a non-common: ' + s.nonSingleton.map(c => c.name + ' ×' + c.qty).join(', '));
    if (problems.length) cleanDetail = problems.join(' — ');
    if (s.banlistWarning) cleanDetail += (problems.length ? ' — ' : ' ') + '⚠ ' + s.banlistWarning;
    addCriterion(s.cleanOk, 'No banned, unrecognized, illegal-printing, or non-singleton cards', cleanDetail);

    breakdownBody.innerHTML = '';
    const sorted = s.results.slice().sort((a, b) => {
      const rd = b.rank - a.rank;
      return rd !== 0 ? rd : a.name.localeCompare(b.name);
    });
    for (const r of sorted){
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + escapeHtml(r.name) + '</td>' +
        '<td>' + r.qty + '</td>' +
        '<td><span class="rarity-tag"><span class="gem ' + rarityClass(r.rarity) + '"></span>' + r.rarity + '</span></td>';
      breakdownBody.appendChild(tr);
    }
    for (const item of s.illegalPrinting){
      const tr = document.createElement('tr');
      tr.innerHTML = '<td>' + escapeHtml(item.name) + '</td><td>—</td>' +
        '<td style="color:var(--bad);" title="' + escapeHtml(item.reason || '') + '">no legal printing</td>';
      breakdownBody.appendChild(tr);
    }
    for (const item of s.notFound){
      const tr = document.createElement('tr');
      tr.innerHTML = '<td>' + escapeHtml(item.name) + '</td><td>—</td>' +
        '<td style="color:var(--bad);" title="' + escapeHtml(item.reason || '') + '">not found — ' + escapeHtml(item.reason || 'unknown reason') + '</td>';
      breakdownBody.appendChild(tr);
    }
    breakdownSummary.textContent = 'Card-by-card rarity breakdown (' + s.results.length + ' card' + (s.results.length === 1 ? '' : 's') + ')';

    if (s.legal){
      printRow.style.display = 'flex';
      lastLegalResults = s.results;
    } else {
      printRow.style.display = 'none';
      lastLegalResults = null;
    }
  }

  function addCriterion(ok, title, detail){
    const li = document.createElement('li');
    li.innerHTML =
      '<span class="mark ' + (ok ? 'ok' : 'no') + '">' + (ok ? '✓' : '✗') + '</span>' +
      '<span class="crit-text">' + title + '<span class="crit-detail">' + detail + '</span></span>';
    criteriaList.appendChild(li);
  }

  function rarityClass(rarity){
    if (rarity === 'mythic') return 'myth';
    if (rarity === 'rare') return 'rare';
    if (rarity === 'uncommon') return 'unc';
    return 'common';
  }

  function escapeHtml(str){
    return str.replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  // ---- Pyramid printing -------------------------------------------------

  let lastLegalResults = null;

  async function buildPyramid(results, deckName){
    const mythicCards = results.filter(r => r.rarity === 'mythic');
    const rareCards = results.filter(r => r.rarity === 'rare');
    const uncommonCards = results.filter(r => r.rarity === 'uncommon');
    const allCards = mythicCards.concat(rareCards, uncommonCards);

    // Prefer the exact printing named in the decklist (set + collector
    // number) for the card art; fall back to the lowest-rarity printing
    // used for legality if no specific printing was given.
    for (const c of allCards){
      c.displayImage = (await fetchExactPrinting(c.set, c.collector)) || c.image;
      await sleep(90);
    }

    function row(cards){
      const div = document.createElement('div');
      div.className = 'pyramid-row';
      for (const c of cards){
        const img = document.createElement('img');
        img.src = c.displayImage || '';
        img.alt = c.name;
        div.appendChild(img);
      }
      return div;
    }

    pyramidPrint.innerHTML = '';
    pyramidPrint.classList.toggle('has-title', !!deckName);

    if (deckName){
      const title = document.createElement('div');
      title.id = 'pyramid-title';
      title.textContent = deckName;
      pyramidPrint.appendChild(title);
    }

    pyramidPrint.appendChild(row(mythicCards));
    pyramidPrint.appendChild(row(rareCards));
    pyramidPrint.appendChild(row(uncommonCards));
  }

  printBtn.addEventListener('click', async function(){
    if (!lastLegalResults) return;
    printBtn.disabled = true;
    const originalLabel = printBtn.textContent;
    printBtn.textContent = 'Preparing…';
    try {
      await buildPyramid(lastLegalResults, deckNameInput.value.trim());
      window.print();
    } finally {
      printBtn.disabled = false;
      printBtn.textContent = originalLabel;
    }
  });

})();
</script>
